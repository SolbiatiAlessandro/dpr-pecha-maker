/* Workbench: controls on a paper panel, pecha folios lying on a slate table. Colours from a painted temple ceiling. */
:root {
  --ink: #211816; --ink-soft: #62544e; --paper: #f7f1e5; --panel: #efe6d6; --rule: #d8cbb6;
  --table: #2c3a43; --table-2: #36474f; --slate: #7a97ab; --verm: #c4482b; --verm-deep: #a53a21;
  --red: #5e1f17; --gold: #c79e4c; --folio: #fbf8f1;
  --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --tib: 'Jomolhari', 'Noto Serif Tibetan', serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--table); color: var(--ink); font: 14px/1.45 var(--ui); }
button, input, select, textarea { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, label.btn:focus-within {
  outline: 2px solid var(--verm); outline-offset: 1px;
}
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: 372px minmax(0, 1fr); }
header {
  grid-column: 1 / -1; display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; background: var(--red); color: var(--paper);
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.mark { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.mark b { font: 400 25px/1.2 var(--tib); }
.mark span { letter-spacing: .08em; font-size: 12px; text-transform: uppercase; opacity: .85; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid rgba(247, 241, 229, .4); background: transparent; color: inherit;
  padding: 6px 12px; border-radius: 3px; cursor: pointer; white-space: nowrap;
}
.btn:hover { background: rgba(247, 241, 229, .12); }
.btn.primary { background: var(--verm); border-color: var(--verm); color: #fff; font-weight: 600; }
.btn.primary:hover { background: var(--verm-deep); }
.btn input { position: absolute; width: 1px; height: 1px; opacity: 0; }

.side { background: var(--paper); display: flex; flex-direction: column; min-height: 0; border-right: 1px solid #1d272d; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--panel); border-bottom: 1px solid var(--rule); }
.tabs button { border: 0; background: none; padding: 10px 4px; cursor: pointer; color: var(--ink-soft); border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--verm); font-weight: 600; }
.pane { padding: 14px 16px 26px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 14px; }
.pane h3 { margin: 6px 0 0; font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--red); }
.pane p.hint { margin: 0; color: var(--ink-soft); font-size: 12.5px; }
#text {
  width: 100%; min-height: 300px; flex: 1; resize: vertical; padding: 10px 12px; background: var(--folio); border: 1px solid var(--rule); border-radius: 3px;
  font: 21px/1.75 var(--tib);
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--rule); background: var(--folio); padding: 3px 9px; border-radius: 3px; cursor: pointer; font-size: 12.5px; }
.chip:hover { border-color: var(--verm); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; font-size: 12.5px; color: var(--ink-soft); }
.field input, .field select { width: 100%; padding: 5px 7px; background: var(--folio); border: 1px solid var(--rule); border-radius: 3px; color: var(--ink); font-variant-numeric: tabular-nums; }
.field.wide { grid-column: 1 / -1; }
.field .tib, .tib { font-family: var(--tib); font-size: 17px; }
.check { display: flex; align-items: flex-start; gap: 7px; font-size: 13px; }
.check input { margin-top: 3px; accent-color: var(--verm); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; }
.seg button { border: 0; background: var(--folio); padding: 6px 4px; cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--red); color: var(--paper); }
.wylie { display: flex; gap: 6px; }
.wylie input { flex: 1; min-width: 0; padding: 5px 7px; border: 1px solid var(--rule); border-radius: 3px; background: var(--folio); }
#wyliePreview { min-height: 30px; font: 19px/1.5 var(--tib); }
.source { font-size: 12px; color: var(--ink-soft); border-top: 1px solid var(--rule); padding-top: 10px; }
.source a { color: var(--verm-deep); }

.stage { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 18px; background: var(--table-2); color: #dfe7ea; font-size: 13px; font-variant-numeric: tabular-nums; }
.bar .seg { border-color: #4f6370; width: 180px; }
.bar .seg button { background: transparent; color: #dfe7ea; }
.bar .seg button[aria-pressed="true"] { background: var(--slate); color: #10181d; }
#warn { color: #ffd38a; }
.table { flex: 1; overflow: auto; padding: 22px 22px 60px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.leaf { width: 100%; max-width: 1180px; display: flex; flex-direction: column; gap: 5px; }
.leaf .tag { color: #b9c8d1; font-size: 12px; font-variant-numeric: tabular-nums; }
.leaf svg { display: block; width: 100%; height: auto; background: var(--folio); box-shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 22px rgba(0, 0, 0, .28); }
.leaf.sheet svg { background: #fff; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: 3px; z-index: 30; max-width: 90vw; }
#printRoot { display: none; }

@media (max-width: 860px) {
  html, body { height: auto; }
  .app { display: block; height: auto; }
  .side { border-right: 0; }
  .pane { overflow: visible; }
  #text { min-height: 200px; }
  .table { padding: 14px 12px 40px; }
  .bar { padding-inline: 12px; }
}
@media print {
  html, body { background: #fff; height: auto; }
  .app, #toast { display: none !important; }
  #printRoot { display: block; }
  .sheet-print { break-after: page; break-inside: avoid; overflow: hidden; }
  .sheet-print svg { display: block; }
}

function newHashSet() {
    var x = []
    x.add = function (K) {
        if (this.indexOf(K) < 0) this.push(K)
    }
    x.contains = function (K) {
        return this.indexOf(K) >= 0
    }
    return x
}

function newHashMap() {
    var x = {}
    x.k = [], x.v = []
    x.put = function (K, V) {
        var i = this.k.indexOf(K)
        if (i < 0) this.k.push(K), this.v.push(V); else this.v[i] = V
    }
    x.containsKey = function (K) {
        return this.k.indexOf(K) >= 0
    }
    x.get = function (K) {
        var i = this.k.indexOf(K)
        if (i >= 0) return this.v[i]
    }
    return x

// Looking from i onwards within tokens, returns as many consonants as it finds,
// up to and not including the next vowel or punctuation.  Skips the caret "^".
// Returns: a string of consonants joined by "+" signs.
function consonantString(tokens, i) { // strings, int
    var out = [];
    var t = '';
    while (tokens[i] != null) {
        t = tokens[i++];
        if (t == '+' || t == '^') continue;
        if (consonant(t) == null) break;
        out.push(t);
    }
    return out.join("+");
}

// Looking from i backwards within tokens, at most up to orig_i, returns as
// many consonants as it finds, up to and not including the next vowel or
// punctuation.  Skips the caret "^".
// Returns: a string of consonants (in forward order) joined by "+" signs.
function consonantStringBackwards(tokens, i, orig_i) {
    var out = [];
    var t = '';
    while (i >= orig_i && tokens[i] != null) {
        t = tokens[i--];
        if (t == '+' || t == '^') continue;
        if (consonant(t) == null) break;
        out.unshift(t);
    }
    return out.join("+");
}

// within the array of tokens.
//
// Assumes that the first available token is valid, and is either a vowel or a consonant.
// Returns a WylieTsekbar object
// HELPER CLASSES AND STRUCTURES
var State = { PREFIX: 0, MAIN: 1, SUFF1: 2, SUFF2: 3, NONE: 4 }
    // split a string into Wylie tokens;
    // make sure there is room for at least one null element at the end of the array
var splitIntoTokens = function(str) {
    var tokens = [] // size = str.length + 2
    var i = 0;
    var maxlen = str.length;
    TOKEN:
    while (i < maxlen) {
        var c = str.charAt(i);
        var mlo = m_tokens_start.get(c);
        // if there are multi-char tokens starting with this char, try them
        if (mlo != null) {
            for (var len = mlo; len > 1; len--) {
                if (i <= maxlen - len) {
                    var tr = str.substring(i, i + len);
                    if (m_tokens.contains(tr)) {
                        tokens.push(tr);
                        i += len;
                        continue TOKEN;
                    }
                }
            }
        }
        // things starting with backslash are special
        if (c == '\\' && i <= maxlen - 2) {
            if (str.charAt(i + 1) == 'u' && i <= maxlen - 6) {
                tokens.push(str.substring(i, i + 6));       // \\uxxxx
                i += 6;
            } else if (str.charAt(i + 1) == 'U' && i <= maxlen - 10) {
                tokens.push(str.substring(i, i + 10));      // \\Uxxxxxxxx
                i += 10;
            } else {
                tokens.push(str.substring(i, i + 2));       // \\x
                i += 2;
            }
            continue TOKEN;
        }
        // otherwise just take one char
        tokens.push(c.toString());
        i += 1;
    }
    return tokens;
}

// helper functions to access the various hash tables
var consonant = function(s) { return m_consonant.get(s) }

    var tmpSet = m_superscripts.get(sup);
    if (tmpSet == null) return false;

}

}

// does this string consist of only hexadecimal digits?
function validHex(t) {
    for (var i = 0; i < t.length; i++) {
        var c = t.charAt(i);
        if (!((c >= 'a' && c <= 'f') || (c >= '0' && c <= '9'))) return false;
    }
    return true;
}

// generate a warning if we are keeping them; prints it out if we were asked to
// handle a Wylie unicode escape, \\uxxxx or \\Uxxxxxxxx
function unicodeEscape (warns, line, t) { // [], int, str
    var hex = t.substring(2);
    if (hex == '') return null;
    if (!validHex(hex)) {
        warnl(warns, line, "\"" + t + "\": invalid hex code.");
        return "";
    }
    return String.fromCharCode(parseInt(hex, 16))
}

function warn(warns, str) {
    if (warns != null) warns.push(str);
}

// warn with line number
function warnl(warns, line, str) {
    warn(warns, "line " + line + ": " + str);
}

function fromWylieOneTsekbar(tokens, i, opts) { // (str, int)
    var orig_i = i
    var t = tokens[i]
    // variables for tracking the state within the syllable as we parse it
    var stack = null
    var prev_cons = ''
    var visarga = false
    // variables for checking the root letter, after parsing a whole tsekbar made of only single
    // consonants and one consonant with "a" vowel
    var check_root = true
    var consonants = [] // strings
    var root_idx = -1
    var out = ''
    var warns = []
    // the type of token that we are expecting next in the input stream
    //   - PREFIX : expect a prefix consonant, or a main stack
    //   - MAIN   : expect only a main stack
    //   - SUFF1  : expect a 1st suffix
    //   - SUFF2  : expect a 2nd suffix
    //   - NONE   : expect nothing (after a 2nd suffix)
    //
    // the state machine is actually more lenient than this, in that a "main stack" is allowed
    // to come at any moment, even after suffixes.  this is because such syllables are sometimes
    // found in abbreviations or other places.  basically what we check is that prefixes and
    // suffixes go with what they are attached to.
    //
    // valid tsek-bars end in one of these states: SUFF1, SUFF2, NONE
    var state = State.PREFIX;

    // iterate over the stacks of a tsek-bar
    STACK:
    while (t != null && (vowel(t) != null || consonant(t) != null) && !visarga) {
        // translate a stack
        if (stack != null) prev_cons = stack.single_consonant;
        stack = fromWylieOneStack(tokens, i, opts);
        i += stack.tokens_used;
        t = tokens[i];
        out += stack.uni_string;
        warns = warns.concat(stack.warns);
        visarga = stack.visarga;
        if (!opts.check) continue;
        // check for syllable structure consistency by iterating a simple state machine
        // - prefix consonant
        if (state == State.PREFIX && stack.single_consonant != null) {
            consonants.push(stack.single_consonant);
            if (isPrefix(stack.single_consonant)) {
            var next = t;
            if (opts.check_strict) next = consonantString(tokens, i);
            if (next != null && !prefix(stack.single_consonant, next)) {
                next = next.replace(/\+/g, "");
                warns.push("Prefix \"" + stack.single_consonant + "\" does not occur before \"" + next + "\".");
            }
        } else {
            warns.push("Invalid prefix consonant: \"" + stack.single_consonant + "\".");
        }
        state = State.MAIN;
        // - main stack with vowel or multiple consonants
        } else if (stack.single_consonant == null) {
        state = State.SUFF1;
        // keep track of the root consonant if it was a single cons with an "a" vowel
        if (root_idx >= 0) {
            check_root = false;
        } else if (stack.single_cons_a != null) {
            consonants.push(stack.single_cons_a);
            root_idx = consonants.length - 1;
        }
        // - unexpected single consonant after prefix
        } else if (state == State.MAIN) {
            warns.push("Expected vowel after \"" + stack.single_consonant + "\".");
            // - 1st suffix
        } else if (state == State.SUFF1) {
            consonants.push(stack.single_consonant);
            // check this one only in strict mode b/c it trips on lots of Skt stuff
            if (opts.check_strict) {
                if (!isSuffix(stack.single_consonant)) {
                    warns.push("Invalid suffix consonant: \"" + stack.single_consonant + "\".");
                }
            }
            state = State.SUFF2;
            // - 2nd suffix
        } else if (state == State.SUFF2) {
            consonants.push(stack.single_consonant);
            if (isSuff2(stack.single_consonant)) {
                if (!suff2(stack.single_consonant, prev_cons)) {
                    warns.push("Second suffix \"" + stack.single_consonant
                    + "\" does not occur after \"" + prev_cons + "\".");
                }
            } else {
                warns.push("Invalid 2nd suffix consonant: \"" + stack.single_consonant  + "\".");
            }
            state = State.NONE;
            // - more crap after a 2nd suffix
        } else if (state == State.NONE) {
            warns.push("Cannot have another consonant \"" + stack.single_consonant + "\" after 2nd suffix.");
        }
    }

    if (state == State.MAIN && stack.single_consonant != null && isPrefix(stack.single_consonant)) {
    warns.push("Vowel expected after \"" + stack.single_consonant + "\".");
    }

    // check root consonant placement only if there were no warnings so far, and the syllable
    // looks ambiguous.  not many checks are needed here because the previous state machine
    // already takes care of most illegal combinations.
    if (opts.check && warns.length == 0 && check_root && root_idx >= 0) {
        // 2 letters where each could be prefix/suffix: root is 1st
        if (consonants.length == 2 && root_idx != 0
        && prefix(consonants[0], consonants[1]) && isSuffix(consonants[1]))
        {
            warns.push("Syllable should probably be \"" + consonants[0] + "a" + consonants[1] + "\".");

            // 3 letters where 1st can be prefix, 2nd can be postfix before "s" and last is "s":
            // use a lookup table as this is completely ambiguous.
        } else if (consonants.length == 3 && isPrefix(consonants[0]) &&
            suff2("s", consonants[1]) && consonants[2] == "s")
        {
            var cc = consonants.join("");
            var expect_key = ambiguous_key(cc);
    //      console.log('typeof expect_key', typeof expect_key)
            if (expect_key != null && expect_key != root_idx) {
                warns.push("Syllable should probably be \"" + ambiguous_wylie(cc) + "\".");
            }
        }
    }
    // return the stuff as a WylieTsekbar struct
    var ret = new WylieTsekbar();
    ret.uni_string = out;
    ret.tokens_used = i - orig_i;
    ret.warns = warns;
    return ret;
}

    // Converts one stack's worth of Wylie into unicode, starting at the given index
    // within the array of tokens.
    // Assumes that the first available token is valid, and is either a vowel or a consonant.
    // Returns a WylieStack object.
function fromWylieOneStack(tokens, i, opts) {
    var orig_i = i
    var t = '', t2 = '', o = ''
    var out = ''
    var warns = []
    var consonants = 0      // how many consonants found
    var vowel_found = null; // any vowels (including a-chen)
    var vowel_sign = null; // any vowel signs (that go under or above the main stack)
    var single_consonant = null; // did we find just a single consonant?
    var plus = false;       // any explicit subjoining via '+'?
    var caret = 0;          // find any '^'?
    var final_found = new newHashMap(); // keep track of finals (H, M, etc) by class

    // do we have a superscript?
    t = tokens[i]
    t2 = tokens[i + 1]
    if (t2 != null && isSuperscript(t) && superscript(t, t2)) {
        if (opts.check_strict) {
            var next = consonantString(tokens, i + 1);
            if (!superscript(t, next)) {
                next = next.replace(/\+/g, '')
                warns.push("Superscript \"" + t + "\" does not occur above combination \"" + next + "\".");
            }
        }
        out += consonant(t);
        consonants++;
        i++;
        while (tokens[i] != null && tokens[i] == ("^")) { caret++; i++; }
    }
    // main consonant + stuff underneath.
    // this is usually executed just once, but the "+" subjoining operator makes it come back here
    MAIN:
    while (true) {
        // main consonant (or a "a" after a "+")
        t = tokens[i];
        if (consonant(t) != null || (out.length > 0 && subjoined(t) != null)) {
            if (out.length > 0) {
                out += (subjoined(t));
            } else {
                out += (consonant(t));
            }
            i++;

            if (t == "a") {
                vowel_found = "a";
            } else {
                consonants++;
                single_consonant = t;
            }

            while (tokens[i] != null && tokens[i] == "^") {
                caret++;
                i++;
            }
            // subjoined: rata, yata, lata, wazur.  there can be up two subjoined letters in a stack.
            for (var z = 0; z < 2; z++) {
                t2 = tokens[i];
                if (t2 != null && isSubscript(t2)) {
                    // lata does not occur below multiple consonants
                    // (otherwise we mess up "brla" = "b.r+la")
                    if (t2 == "l" && consonants > 1) break;
                    // full stack checking (disabled by "+")
                    if (opts.check_strict && !plus) {
                        var prev = consonantStringBackwards(tokens, i-1, orig_i);
                        if (!subscript(t2, prev)) {
                            prev = prev.replace(/\+/g, "");
                            warns.push("Subjoined \"" + t2 + "\" not expected after \"" + prev + "\".");
                        }
                        // simple check only
                    } else if (opts.check) {
                        if (!subscript(t2, t) && !(z == 1 && t2 == ("w") && t == ("y"))) {
                            warns.push("Subjoined \"" + t2 + "\"not expected after \"" + t + "\".");
                        }
                    }
                    out += subjoined(t2);
                    i++;
                    consonants++;
                    while (tokens[i] != null && tokens[i] == ("^")) { caret++; i++; }
                    t = t2;
                } else {
                    break;
                }
            }
        }

        // caret (^) can come anywhere in Wylie but in Unicode we generate it at the end of
        // the stack but before vowels if it came there (seems to be what OpenOffice expects),
        // or at the very end of the stack if that's how it was in the Wylie.
        if (caret > 0) {
            if (caret > 1) {
                warns.push("Cannot have more than one \"^\" applied to the same stack.");
            }
            final_found.put(final_class("^"), "^");
            out += (final_uni("^"));
            caret = 0;
        }
        // vowel(s)
        t = tokens[i];
        if (t != null && vowel(t) != null) {
            if (out.length == 0) out += (vowel("a"));
            if (t != "a") out += (vowel(t));
            i++;
            vowel_found = t;
            if (t != "a") vowel_sign = t;
        }
        // plus sign: forces more subjoining
        t = tokens[i];
        if (t != null && t == ("+")) {
            i++;
            plus = true;
            // sanity check: next token must be vowel or subjoinable consonant.
            t = tokens[i];
            if (t == null || (vowel(t) == null && subjoined(t) == null)) {
                if (opts.check) warns.push("Expected vowel or consonant after \"+\".");
                break MAIN;
            }
            // consonants after vowels doesn't make much sense but process it anyway
            if (opts.check) {
                if (vowel(t) == null && vowel_sign != null) {
                    warns.push("Cannot subjoin consonant (" + t + ") after vowel (" + vowel_sign + ") in same stack.");
                } else if (t == ("a") && vowel_sign != null) {
                    warns.push("Cannot subjoin a-chen (a) after vowel (" + vowel_sign + ") in same stack.");
                }
            }
            continue MAIN;
        }
        break MAIN;
    }
    // final tokens
    t = tokens[i];
    while (t != null && final_class(t) != null) {
        var uni = final_uni(t);
        var klass = final_class(t);
        // check for duplicates
        if (final_found.containsKey(klass)) {
            if (final_found.get(klass) == t) {
                warns.push("Cannot have two \"" + t + "\" applied to the same stack.");
            } else {
                warns.push("Cannot have \"" + t + "\" and \"" + final_found.get(klass)
                    + "\" applied to the same stack.");
            }
        } else {
            final_found.put(klass, t);
            out += (uni);
        }
        i++;
        single_consonant = null;
        t = tokens[i];
    }
    // if next is a dot "." (stack separator), skip it.
    if (tokens[i] != null && tokens[i] == (".")) i++;
    // if we had more than a consonant and no vowel, and no explicit "+" joining, backtrack and
    // return the 1st consonant alone
    if (consonants > 1 && vowel_found == null) {
        if (plus) {
            if (opts.check) warns.push("Stack with multiple consonants should end with vowel.");
        } else {
            i = orig_i + 1;
            consonants = 1;
            single_consonant = tokens[orig_i];
            out = '';
            out += (consonant(single_consonant));
        }
    }
    // calculate "single consonant"
    if (consonants != 1 || plus) {
        single_consonant = null;
    }
    // return the stuff as a WylieStack struct
    var ret = new WylieStack();
    ret.uni_string = out;
    ret.tokens_used = i - orig_i;
    if (vowel_found != null) {
        ret.single_consonant = null;
    } else {
        ret.single_consonant = single_consonant;
    }

    if (vowel_found != null && vowel_found == ("a")) {
        ret.single_cons_a = single_consonant;
    } else {
        ret.single_cons_a = null;
    }
    ret.warns = warns;
    ret.visarga = final_found.containsKey("H");
    return ret;
}

function sloppyRepl(str) {
    str = str.replace(/[ʼʹ‘’ʾ]/g, "'");
    str = str.replace(/ ([\(0-9])/g, "_$1");
    str = str.replace(/([_\)\/]) /g, "$1_");
    str = str.replace(/G/g, "g");
    str = str.replace(/C/g, "c");
    str = str.replace(/B/g, "b");
    str = str.replace(/L/g, "l");
    str = str.replace(/P/g, "p");
    str = str.replace(/Z/g, "z");
    str = str.replace(/^\s+/, '');
    return str;
}

// Converts a Wylie (EWTS) string to unicode.  If 'warns' is not 'null', puts warnings into it.
function fromWylie(str, opts, warns) {
    if (!warns) {
        warns = [];
    }
    if (!opts) {
        opts = {
            sloppy: true
        };
    }
    if (opts.sloppy) {
        str = sloppyRepl(str);
    }
    var out = '', line = 1, units = 0, i = 0;
    var tokens = splitIntoTokens(str);
    ITER:
    while (tokens[i] != null) {
        var t = tokens[i], o = null
        // [non-tibetan text] : pass through, nesting brackets
        if (t == "[") {
            var nesting = 1;
            i++;
                ESC:while (tokens[i] != null) {
                t = tokens[i++];
                if (t == "[") nesting++;
                if (t == "]") nesting--;
                if (nesting == 0) continue ITER;
                // handle unicode escapes and \1-char escapes within [comments]...
                if (t.charAt(0) == '\\' && (t.charAt(1) == 'u' || t.charAt(1) == 'U')) {
                    o = unicodeEscape(warns, line, t);
                    if (o != null) {
                        out += o;
                        continue ESC;
                    }
                }
                if (t.charAt(0) == '\\') {
                    o = t.substring(1);
                } else {
                    o = t;
                }
                out += o;
            }
            warnl(warns, line, "Unfinished [non-Wylie stuff].");
            break ITER;
        }
        // punctuation, numbers, etc
        o = other(t);
        if (o != null) {
            out += o;
            i++;
            units++;
            // collapse multiple spaces?
            if (t == " " && opts.sloppy) {
                while (tokens[i] != null && tokens[i] == " ") i++;
            }
            continue ITER;
        }
        // vowels & consonants: process tibetan script up to a tsek, punctuation or line noise
        if (vowel(t) != null || consonant(t) != null) {
            var tb = fromWylieOneTsekbar(tokens, i, opts);
            var word = '';
            for (var j = 0; j < tb.tokens_used; j++) {
                word += (tokens[i+j]);
            }
            out += tb.uni_string;
            i += tb.tokens_used;
            units++;
            for (var w = 0; w < tb.warns.length; w++) {
                warnl(warns, line, "\"" + word + "\": " + tb.warns[w]);
            }
            continue ITER;
        }
        // *** misc unicode and line handling stuff ***
        // ignore BOM and zero-width space
        if (t == "\ufeff" || t == "\u200b") {
            i++;
            continue ITER;
        }
        // \\u, \\U unicode characters
        if (t.charAt(0) == '\\' && (t.charAt(1) == 'u' || t.charAt(1) == 'U')) {
            o = unicodeEscape(warns, line, t);
            if (o != null) {
                i++;
                out += o;
                continue ITER;
            }
        }
        // backslashed characters
        if (t.charAt(0) == '\\') {
            out += t.substring(1);
            i++;
            continue ITER;
        }
        // count lines
        if (t == "\r\n" || t == "\n" || t == "\r") {
            line++;
            out += t;
            i++;
            // also eat spaces after newlines (optional)
            if (opts.sloppy) {
                while (tokens[i] != null && tokens[i] == " ") i++;
            }
            continue ITER;
        }
        // stuff that shouldn't occur out of context: special chars and remaining [a-zA-Z]
        var c = t.charAt(0);
        if (isSpecial(t) || (c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z')) {
            warnl(warns, line, "Unexpected character \"" + t + "\".");
        }
        // anything else: pass through
        out += t;
        i++;
    }
    if (units == 0) warn(warns, "No Tibetan characters found!");
    return out
}

    // given a character, return a string like "\\uxxxx", with its code in hex
function formatHex(t) { //char
        // not compatible with GWT...
        // return String.format("\\u%04x", (int)t);
        var sb = '';
        sb += '\\u';
        var s = t.charCodeAt(0).toString(16);
        for (var i = s.length; i < 4; i++) sb += '0';
        sb += s;
        return sb;
    }

    // handles spaces (if any) in the input stream, turning them into '_'.
    // this is abstracted out because in non-escaping mode, we only want to turn spaces into _
    // when they come in the middle of Tibetan script.
function handleSpaces(str, i, out) { //return int
    var found = 0;
    var orig_i = i;
    while (i < str.length && str.charAt(i) == ' ') {
        i++;
        found++;
    }
    if (found == 0 || i == str.length) return 0;
    var t = str.charAt(i);
    if (tib_top(t) == null && tib_other(t) == null) return 0;
    // found 'found' spaces between two tibetan bits; generate the same number of '_'s
    for (i = 0; i < found; i++) out += '_';
    return found;
}

// for space-handling in escaping mode: is the next thing coming (after a number of spaces)
// some non-tibetan bit, within the same line?
function followedByNonTibetan(str, i) {
    var len = str.length;
    while (i < len && str.charAt(i) == ' ') i++;
    if (i == len) return false;
    var t = str.charAt(i);
    return tib_top(t) == null && tib_other(t) == null && t != '\r' && t != '\n';
}

// Convert Unicode to Wylie: one tsekbar
function toWylieOneTsekbar(str, len, i) {
    var orig_i = i;
    var warns = [];
    var stacks = [];// ArrayList<ToWylieStack>;
    ITER:
    while (true) {
        var st = toWylieOneStack(str, len, i);
        stacks.push(st);
        warns = warns.concat(st.warns);
        i += st.tokens_used;
        if (st.visarga) break ITER;
        if (i >= len || tib_top(str.charAt(i)) == null) break ITER;
    }
    // figure out if some of these stacks can be prefixes or suffixes (in which case
    // they don't need their "a" vowels)
    var last = stacks.length - 1;
    if (stacks.length > 1 && stacks[0].single_cons != null) {
        // we don't count the wazur in the root stack, for prefix checking
        var cs = stacks[1].cons_str.replace(/\+w/g, "")
        if (prefix(stacks[0].single_cons, cs)) stacks[0].prefix = true;
    }
    if (stacks.length > 1 && stacks[last].single_cons != null
    && isSuffix(stacks[last].single_cons)) {
        stacks[last].suffix = true;
    }
    if (stacks.length > 2 && stacks[last].single_cons != null
    && stacks[last - 1].single_cons != null

        for (var si = 0; si < stacks.length; si++) strb.push(stacks[si].single_cons)

        var root = ambiguous_key(ztr)

            warns.push("Ambiguous syllable found: root consonant not known for \"" + ztr + "\".")

        stacks[root + 1].suff2 = false

    ret.tokens_used = i - orig_i;

// Unicode to Wylie: one stack at a time
function toWylieOneStack(str, len, i) {
    var orig_i = i;
    var ffinal = null, vowel = null, klass = null;
    // split the stack into a ToWylieStack object:
    //   - top symbol
    //   - stacked signs (first is the top symbol again, then subscribed main characters...)
    //   - caret (did we find a stray tsa-phru or not?)
    //   - vowel signs (including small subscribed a-chung, "-i" Skt signs, etc)
    //   - final stuff (including anusvara, visarga, halanta...)
    //   - and some more variables to keep track of what has been found
    var st = new ToWylieStack();
    // assume: tib_top(t) exists
    var t = str.charAt(i++);
    st.top = tib_top(t);
    st.stack.push(tib_top(t));
    // grab everything else below the top sign and classify in various categories
    while (i < len) {
        t = str.charAt(i);
        var o;
        if ((o = tib_subjoined(t)) != null) {
            i++;
            st.stack.push(o);
            // check for bad ordering
            if (st.finals.length > 0) {
                st.warns.push("Subjoined sign \"" + o + "\" found after final sign \"" + ffinal + "\".");
            } else if (st.vowels.length > 0) {
                st.warns.push("Subjoined sign \"" + o + "\" found after vowel sign \"" + vowel + "\".");
            }
        } else if ((o = tib_vowel(t)) != null) {
            i++;
            st.vowels.push(o);
            if (vowel == null) vowel = o;
            // check for bad ordering
            if (st.finals.length > 0) {
                st.warns.push("Vowel sign \"" + o + "\" found after final sign \"" + ffinal + "\".");
            }
        } else if ((o = tib_final_wylie(t)) != null) {
            i++;
            klass = tib_final_class(t);
            if (o == "^") {
                st.caret = true;
            } else {
                if (o == "H") st.visarga = true;
                st.finals.push(o);
                if (ffinal == null) ffinal = o;
                // check for invalid combinations
                if (st.finals_found.containsKey(klass)) {
                    st.warns.push("Final sign \"" + o
                    + "\" should not combine with found after final sign \"" + ffinal + "\".");
                } else {
                    st.finals_found.put(klass, o);
                }
            }
        } else break;
    }
    // now analyze the stack according to various rules
    // a-chen with vowel signs: remove the "a" and keep the vowel signs
    if (st.top == "a" && st.stack.length == 1 && st.vowels.length > 0) st.stack.shift();
    // handle long vowels: A+i becomes I, etc.
    if (st.vowels.length > 1 && st.vowels[0] == "A" && tib_vowel_long(st.vowels[1]) != null) {
        var l = tib_vowel_long(st.vowels[1]);
        st.vowels.shift();
        st.vowels.shift();
        st.vowels.unshift(l);
    }
    // special cases: "ph^" becomes "f", "b^" becomes "v"
    if (st.caret && st.stack.length == 1 && tib_caret(st.top) != null) {
        var l = tib_caret(st.top);
        st.top = l;
        st.stack.shift();
        st.stack.unshift(l);
        st.caret = false;
    }
    st.cons_str = st.stack.join("+");
    // if this is a single consonant, keep track of it (useful for prefix/suffix analysis)
    if (st.stack.length == 1 && st.stack[0] != ("a") && !st.caret
    && st.vowels.length == 0 && st.finals.length == 0) {
        st.single_cons = st.cons_str;
    }
    // return the analyzed stack
    st.tokens_used = i - orig_i;
    return st;
}

// Puts an analyzed stack together into Wylie output, adding an implicit "a" if needed.
function putStackTogether(st) {
    var out = '';
    // put the main elements together... stacked with "+" unless it's a regular stack
    if (tib_stack(st.cons_str)) {
        out += st.stack.join("");
    } else out += (st.cons_str);
    // caret (tsa-phru) goes here as per some (halfway broken) Unicode specs...
    if (st.caret) out += ("^");
    // vowels...
    if (st.vowels.length > 0) {
        out += st.vowels.join("+");
    } else if (!st.prefix && !st.suffix && !st.suff2
    && (st.cons_str.length == 0 || st.cons_str.charAt(st.cons_str.length - 1) != 'a')) {
        out += "a"
    }
    // final stuff
    out += st.finals.join("");
    if (st.dot) out += ".";
    return out;
}

    //
    // Arguments are:
    //    str   : the unicode string to be converted
    //    escape: whether to escape non-tibetan characters according to Wylie encoding.
    //            if escape == false, anything that is not tibetan will be just passed through.

    // Returns: the transliterated string.

// Folio numbers spelled out in Tibetan, the way they appear in a pecha margin.
const Folio = (() => {
  const T = '་';
  const UNITS = ['', 'གཅིག', 'གཉིས', 'གསུམ', 'བཞི', 'ལྔ', 'དྲུག', 'བདུན', 'བརྒྱད', 'དགུ'];
  const TENS = ['', 'བཅུ', 'ཉི་ཤུ', 'སུམ་ཅུ', 'བཞི་བཅུ', 'ལྔ་བཅུ', 'དྲུག་ཅུ', 'བདུན་ཅུ', 'བརྒྱད་ཅུ', 'དགུ་བཅུ'];
  const LINK = ['', 'བཅུ', 'ཉེར', 'སོ', 'ཞེ', 'ང', 'རེ', 'དོན', 'གྱ', 'གོ'];
  const HUNDREDS = ['', 'བརྒྱ', 'ཉིས་བརྒྱ', 'སུམ་བརྒྱ', 'བཞི་བརྒྱ', 'ལྔ་བརྒྱ', 'དྲུག་བརྒྱ', 'བདུན་བརྒྱ', 'བརྒྱད་བརྒྱ', 'དགུ་བརྒྱ'];

  // 21-99 standing alone use the full form (བརྒྱད་ཅུ་གྱ་གཉིས); after hundreds, the short one (གྱ་གཉིས).
  function below100(n, afterHundreds) {
    if (n < 10) return UNITS[n];
    if (n === 15) return 'བཅོ་ལྔ';
    if (n === 18) return 'བཅོ་བརྒྱད';

    if (t === 1) return LINK[1] + T + UNITS[u];

  function words(n) {
    if (n >= 1000) return 'སྟོང་ཕྲག་གཅིག' + T + (n > 1000 ? ' ' + words(n - 1000) : '');

  const noteSlot = (text = '', size = 13, inset = 0.1) => ({ on: !!text, text, size, inset });
  const noteSet = (over = {}) => ({
    inL: noteSlot(), inB: noteSlot(), inR: noteSlot(), outL: noteSlot(), outR: noteSlot(), ...over,
  });

  function defaultDoc() {
    return {
      version: 1,
      text: '',
      flow: true,
      font: "'Jomolhari','Noto Serif Tibetan',serif",
      fontName: 'Jomolhari',
      tabWidth: 0.5,
      paper: { name: 'A4', w: 11.69, h: 8.27 },
      margins: { left: 0.3, right: 0.3 },
      pecha: { height: 2.55, dlt: 0.03, perSheet: 3 },
      counts: { title: 1, fancy: 2 },
      types: {
        title: pageType({ lines: 2, lineHeight: 0.5, fontSize: 25, sideIn: 0.42, sideOut: 0.72, insideOn: true, inside: 0.32, squeezeOn: true, squeeze: 0.14 }),
        fancy: pageType({ lines: 3, lineHeight: 0.5, fontSize: 26, sideIn: 0.42, sideOut: 1.0, insideOn: true, inside: 0.28 }),
        body: pageType(),
      },
      shad: { enabled: true, yang: true, ignoreYigo: false, titlePages: false },
      yigo: { enabled: true, text: '༄༅༅། །', fancyStart: true, title2: false },
      dzog: { enabled: true, rise: 0.05 },
      folio: { start: 1, onTitle: false, jyon: false, inset: 0.1, size: 13, rhino: '' },
      pageNum: { start: 1, onTitle: false, inset: 0.05, size: 9, on: true },
      notes: {
        outLeft: 0, outRight: 0,
        sets: {
          'title.front': noteSet(), 'title.back': noteSet(),
          'fancy.front': noteSet(), 'fancy.back': noteSet(),
          'body.front': noteSet(), 'body.back': noteSet(),
        },
      },
      print: { sides: 'duplex', cutMarks: true, stack: false },
    };
  }

  // ---------- stream ----------

  // Format codes sit in the text, as in PechaMaker: {c} {j} {l} {r} {30} {#b03020} {b} {/b} {i} {/i} {page}
  function parseStream(text, flow) {
    const style = { align: 'j', size: null, color: null, bold: false, italic: false };
    const items = [];
    const src = prepareBreaks(text || '', flow);
    const re = /\{([^{}\n]*)\}/g;
    let last = 0, m;
    const pushText = s => { if (s) items.push({ k: 'text', s, style: { ...style } }); };
    while ((m = re.exec(src))) {
      pushText(src.slice(last, m.index));
      last = re.lastIndex;
      for (const tok of m[1].trim().split(/\s+/)) {
        if (tok === 'c' || tok === 'center') style.align = 'c';
        else if (tok === 'j' || tok === 'justify') style.align = 'j';
        else if (tok === 'l' || tok === 'left') style.align = 'l';
        else if (tok === 'r' || tok === 'right') style.align = 'r';
        else if (tok === 'page') items.push({ k: 'page' });
        else if (tok === 'hs') pushText(HARD_SHAD);
        else if (tok === 'b') style.bold = true;
        else if (tok === '/b') style.bold = false;
        else if (tok === 'i') style.italic = true;
        else if (tok === '/i') style.italic = false;
        else if (/^\d+(\.\d+)?$/.test(tok)) style.size = +tok;
        else if (/^#[0-9a-f]{3,6}$/i.test(tok)) style.color = tok;
        else if (tok === 'size') style.size = null;
        else if (tok === 'color') style.color = null;
      }
    }
    pushText(src.slice(last));
    return items;
  }

  // Flow mode: pasted verses run on, and a blank line is a hard return. Shad and tsheg at the end
  // of a verse join the next verse with no added space, which is how a pecha reads.
  function prepareBreaks(text, flow) {
    const t = text.replace(/\r\n?/g, '\n');
    if (!flow) return t.replace(/\n/g, ' ');
    return t
      .split(/\n[ \t]*\n+/)
      .map(par => par.split('\n').map(l => l.trim()).filter(Boolean).reduce((acc, line) => {
        if (!acc) return line;
        return acc + (isTib(acc[acc.length - 1]) ? '' : ' ') + line;
      }, ''))
      .join(' ');
  }

  function splitAtoms(s) {
    const out = [];
    let cur = '', sawLetter = false;
    const push = gap => {
      if (cur) out.push({ s: cur, gap, spaces: 0 });
      cur = ''; sawLetter = false;
    };
    for (let i = 0; i < s.length; i++) {
      const ch = s[i], nx = s[i + 1] || '';
      if (ch === ' ') { push('none'); out.push({ hr: true }); continue; }
      if (ch === '\t') { push('none'); out.push({ tab: true }); continue; }
      if (ch === ' ' || ch === ' ') {
        if (cur) push('space');
        if (out.length) { const a = out[out.length - 1]; if (a.s !== undefined) { a.gap = 'space'; a.spaces++; } }
        continue;
      }
      cur += ch;
      if (!isClosing(ch) && ch !== TSEK) sawLetter = true;
      if (ch === TSEK) {
        if (!isClosing(nx)) push('tsheg');
      } else if (isClosing(ch) && sawLetter && nx && nx !== ' ' && !isClosing(nx)) {
        push('tsheg');
      } else if (!isTib(ch) && isTib(nx)) {
        push('tsheg');
      }
    }
    push('none');
    return out;
  }

  function atomize(items, doc, measure) {
    const atoms = [];
    for (const it of items) {
      if (it.k === 'page') { atoms.push({ page: true }); continue; }
      for (const a of splitAtoms(it.s)) atoms.push({ ...a, style: it.style });
    }
    return atoms;
  }

  // ---------- geometry ----------

  function boxes(doc, type) {
    const w = (doc.paper.w - doc.margins.left - doc.margins.right) * PT;
    const h = doc.pecha.height * PT;
    const sq = type.squeezeOn ? type.squeeze * PT : 0;
    const O = { x0: sq + doc.notes.outLeft * PT, y0: sq, x1: w - sq - doc.notes.outRight * PT, y1: h - sq };
    const ins = type.insideOn ? type.inside * PT : 0;
    const I = { x0: O.x0 + ins, y0: O.y0 + ins, x1: O.x1 - ins, y1: O.y1 - ins };
    const d = type.style === 'double' ? doc.pecha.dlt * PT : 0;
    const cellA = type.sideOut * PT, cellB = type.sideIn * PT;
    const lx1 = I.x0 + d + cellA, lx2 = lx1 + (cellB ? d + cellB : 0);
    const rx1 = I.x1 - d - cellA, rx2 = rx1 - (cellB ? d + cellB : 0);
    const inner = (cellA ? d : 0);
    const T = {
      x0: lx2 + inner + type.side * PT, x1: rx2 - inner - type.side * PT,
      y0: I.y0 + d, y1: I.y1 - d,
    };
    return { w, h, O, I, T, d, lx1, lx2, rx1, rx2 };
  }

  function typeOfPage(doc, n) {
    const { title, fancy } = doc.counts;
    if (n <= title) return 'title';
    if (n <= title + fancy) return 'fancy';
    return 'body';
  }

  // ---------- lines and pages ----------

  function yigoWanted(doc, n, kind, isFirstFancy) {
    if (!doc.yigo.enabled) return false;
    if (kind === 'title') return doc.yigo.title2 && n > 1 && n % 2 === 1;
    if (kind === 'fancy' && !doc.yigo.fancyStart) return false;
    if (isFirstFancy) return true;
    return n % 2 === 1;
  }

  function fontFor(doc, atom, sizeDefault) {
    const st = atom.style || {};
    const size = st.size || sizeDefault;
    return { size, weight: st.bold ? 700 : 400, italic: !!st.italic, family: doc.font };
  }

  function fillLine(atoms, start, W, doc, sizeDefault, measure, yigo) {
    const items = [];
    let i = start, x = 0, prevGap = 0, hard = false, pageBreak = false, hasTab = false, yigoCount = 0;
    const place = a => {
      const f = fontFor(doc, a, sizeDefault);
      const w = measure(a.s, f);
      const gapW = a.gap === 'space' ? Math.max(measure(' ', f), f.size * 0.42) * Math.max(1, a.spaces) : 0;
      return { ...a, f, w, gapW };
    };
    if (yigo) {
      for (const a of splitAtoms(doc.yigo.text)) {
        const p = place({ ...a, style: atoms[start].style });
        p.x = x + prevGap; x = p.x + p.w; prevGap = p.gapW;
        items.push(p); yigoCount++;
      }
      const last = items[items.length - 1];
      if (last && last.gap === 'none') { last.gap = 'tsheg'; }
    }
    for (; i < atoms.length; i++) {
      const a = atoms[i];
      if (a.hr) { hard = true; i++; break; }
      if (a.page) { pageBreak = true; hard = true; i++; break; }
      if (a.tab) {
        const tab = doc.tabWidth * PT;
        x = (Math.floor((x + prevGap + 0.01) / tab) + 1) * tab;
        prevGap = 0; hasTab = true;
        continue;
      }
      const p = place(a);
      if (items.length > yigoCount && x + prevGap + p.w > W + 0.01) break;
      if (items.length === yigoCount && yigoCount && x + prevGap + p.w > W) break;
      p.x = x + prevGap;
      x = p.x + p.w; prevGap = p.gapW;
      items.push(p);
    }
    const align = (items.length ? items[items.length - 1].style.align : (atoms[start] && atoms[start].style ? atoms[start].style.align : 'j')) || 'j';
    return { items, next: i, hard, pageBreak, hasTab, align, yigoCount, natural: x };
  }

  // A shad straight after the tsheg-bar that opens a line becomes a rinchen pung shad; display only.
  function convertShads(line, doc, kind, lineIndex, measure) {
    const o = doc.shad;
    if (!o.enabled || !line.items.length) return;
    if (kind === 'title' && (!o.titlePages || lineIndex === 0)) return;
    if (line.yigoCount && /[།]/.test(doc.yigo.text) && !o.ignoreYigo) return;
    const idx = line.yigoCount;
    const a = line.items[idx];
    if (!a || !isTib(a.s[0])) return;
    const m = /^([^་༌།-༔\s]+་?)།/.exec(a.s);
    if (!m) return;
    a.s = m[1] + RINCHEN + a.s.slice(m[0].length);
    a.w = measure(a.s, a.f);
    const b = line.items[idx + 1];
    if (o.yang && b && a.gap === 'space' && b.s[0] === SHAD) {
      b.s = RINCHEN + b.s.slice(1);
      b.w = measure(b.s, b.f);
    }
  }

  function reflow(line, W, justify) {
    let x = 0, spaces = [], tshegs = [];
    const its = line.items;
    its.forEach((p, k) => {
      if (k < its.length - 1) (p.gap === 'space' ? spaces : p.gap === 'tsheg' ? tshegs : []).push(p);
    });
    let extraSpace = 0, extraTsheg = 0;
    if (justify) {
      const natural = its.reduce((s, p, k) => s + p.w + (k < its.length - 1 ? p.gapW : 0), 0);
      const extra = Math.max(0, W - natural);
      if (spaces.length) {
        const cap = (its[0] ? its[0].f.size : 20) * 3.2;
        extraSpace = Math.min(extra / spaces.length, tshegs.length ? cap : Infinity);
        if (tshegs.length) extraTsheg = (extra - extraSpace * spaces.length) / tshegs.length;
      } else if (tshegs.length) {
        extraTsheg = extra / tshegs.length;
      }
    }
    its.forEach((p, k) => {
      p.x = x;
      x += p.w;
      if (k < its.length - 1) x += p.gapW + (p.gap === 'space' ? extraSpace : p.gap === 'tsheg' ? extraTsheg : 0);
    });
    line.width = x;
    const off = line.align === 'c' ? (W - x) / 2 : line.align === 'r' ? W - x : 0;
    if (off > 0) its.forEach(p => { p.x += off; });
    line.endX = x + Math.max(0, off);
  }

  function paginate(doc, atoms, measure) {
    const pages = [];
    let i = 0, firstFancy = true;
    const limit = 3000;
    do {
      const n = pages.length + 1;
      const kind = typeOfPage(doc, n);
      const type = doc.types[kind];
      const B = boxes(doc, type);
      const W = B.T.x1 - B.T.x0;
      const lines = [];
      const isFirstFancy = kind === 'fancy' && firstFancy;
      if (kind === 'fancy') firstFancy = false;
      for (let ln = 0; ln < type.lines && i < atoms.length; ln++) {
        const nextA = atoms[i];
        const startsTib = nextA && nextA.s && isTib(nextA.s[0]) && !isYigMgo(nextA.s[0]);
        const wantYigo = ln === 0 && startsTib && yigoWanted(doc, n, kind, isFirstFancy);
        const line = fillLine(atoms, i, W, doc, type.fontSize, measure, wantYigo);
        if (line.next === i) { line.next = i + 1; }        // an atom wider than the line must not stall the loop
        i = line.next;
        convertShads(line, doc, kind, ln, measure);
        const atEnd = i >= atoms.length;
        reflow(line, W, line.align === 'j' && !line.hard && !atEnd && !line.hasTab);
        lines.push(line);
        if (line.pageBreak) break;
      }
      pages.push({ n, kind, lines, front: n % 2 === 1, boxes: B, type });
    } while (i < atoms.length && pages.length < limit);
    return pages;
  }

  // ---------- rendering ----------

  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(//g, SHAD);
  const num = v => Math.round(v * 100) / 100;

  function textEl(x, y, s, f, color, extra = '') {
    const st = (f.weight > 400 ? ' font-weight="700"' : '') + (f.italic ? ' font-style="italic"' : '');
    return `<text x="${num(x)}" y="${num(y)}" font-size="${num(f.size)}"${color ? ` fill="${color}"` : ''}${st}${extra}>${esc(s)}</text>`;
  }

  function sideText(x, y, s, size, doc, anchor) {
    return `<text transform="translate(${num(x)} ${num(y)}) rotate(-90)" font-size="${num(size)}" text-anchor="${anchor}">${esc(s)}</text>`;
  }

  function drawBoxes(p, doc) {
    const { O, I, d, lx1, lx2, rx1, rx2 } = p.boxes;
    const t = p.type;
    if (t.style === 'none') return '';
    const stroke = `fill="none" stroke="${t.color}" stroke-width="0.7"`;
    const rect = (r, inset = 0) => `<rect x="${num(r.x0 + inset)}" y="${num(r.y0 + inset)}" width="${num(r.x1 - r.x0 - 2 * inset)}" height="${num(r.y1 - r.y0 - 2 * inset)}" ${stroke}/>`;
    let out = rect(O);
    if (d) out += rect(O, d);
    if (t.insideOn) { out += rect(I); if (d) out += rect(I, d); }
    const y0 = I.y0 + d, y1 = I.y1 - d;
    const vert = x => `<line x1="${num(x)}" y1="${num(y0)}" x2="${num(x)}" y2="${num(y1)}" ${stroke}/>`;
    const vs = [];
    if (t.sideOut) vs.push(lx1, rx1);
    if (t.sideIn) vs.push(lx2, rx2);
    for (const x of vs) {
      out += vert(x);
      if (d) out += vert(x < (O.x0 + O.x1) / 2 ? x + d : x - d);
    }
    return out;
  }

  function drawText(p, doc, measure) {
    const { T } = p.boxes, t = p.type;
    const head = measure.head(doc, t.fontSize);
    const room = T.y1 - T.y0;
    const nLines = p.kind === 'title' ? Math.max(1, p.lines.length) : t.lines;   // a short last page starts where full pages do
    const block = (nLines - 1) * t.lineHeight * PT + head.height;
    const start = t.top === null ? T.y0 + (room - block) / 2 : T.y0 + t.top * PT;
    let out = '';
    p.lineTops = [];
    p.lines.forEach((line, ln) => {
      const top = start + ln * t.lineHeight * PT;
      p.lineTops.push(top);
      for (const a of line.items) {
        const h = measure.head(doc, a.f.size, isTib(a.s[0]));
        out += textEl(T.x0 + a.x, top + h.ascent, a.s, a.f, a.style && a.style.color);
      }
    });
    return out;
  }

  function drawDzog(p, doc, measure) {
    const { T } = p.boxes;
    const last = p.lines.length - 1;
    if (last < 0) return '';
    const head = measure.head(doc, p.type.fontSize);
    const yOf = k => p.lineTops[k] + head.height + 1.5;
    const y1 = yOf(last);
    const x = T.x0 + p.lines[last].endX + doc.dzog.rise * PT;
    const stroke = `fill="none" stroke="#000" stroke-width="0.9"`;
    if (last === 0 || x > T.x0 + 0.98 * (T.x1 - T.x0)) {
      return `<path d="M${num(T.x0)} ${num(y1)}H${num(T.x1)}" ${stroke}/>`;
    }
    const y0 = yOf(last - 1);
    return `<path d="M${num(T.x0)} ${num(y1)}H${num(x)}V${num(y0)}H${num(T.x1)}" ${stroke}/>`;
  }

  function drawMargins(p, doc, measure, folioCount) {
    const { O, w, h } = p.boxes;
    const set = doc.notes.sets[`${p.kind}.${p.front ? 'front' : 'back'}`];
    let out = '';
    const asc = size => measure.head(doc, size);
    const pad = 9;
    const midY = (O.y0 + O.y1) / 2;
    const inX = (slot, right) => {
      const m = asc(slot.size);
      return right ? O.x1 - slot.inset * PT - m.descent : O.x0 + slot.inset * PT + m.ascent;
    };
    if (set.inL.on && set.inL.text) out += sideText(inX(set.inL), O.y0 + pad, set.inL.text, set.inL.size, doc, 'end');
    if (set.inB.on && set.inB.text) out += sideText(inX(set.inB), O.y1 - pad, set.inB.text, set.inB.size, doc, 'start');
    if (set.inR.on && set.inR.text) out += sideText(inX(set.inR, true), midY, set.inR.text, set.inR.size, doc, 'middle');
    if (set.outL.on && set.outL.text) out += sideText(set.outL.inset * PT + asc(set.outL.size).ascent, midY, set.outL.text, set.outL.size, doc, 'middle');
    if (set.outR.on && set.outR.text) out += sideText(w - set.outR.inset * PT - asc(set.outR.size).descent, midY, set.outR.text, set.outR.size, doc, 'middle');

    const fo = doc.folio;
    const showFolio = p.front && fo.start > 0 && (p.kind !== 'title' || fo.onTitle);
    if (showFolio) {
      const number = fo.start + (p.n - 1) / 2;
      const isLast = (p.n + 1) / 2 >= folioCount;
      const label = fo.rhino || Folio.words(number) + (fo.jyon && isLast ? Folio.JYON : '');
      const x = O.x0 + fo.inset * PT + asc(fo.size).ascent;
      out += sideText(x, midY, label, fo.size, doc, 'middle');
    }
    const pn = doc.pageNum;
    if (pn.on && pn.start > 0 && (p.kind !== 'title' || pn.onTitle)) {
      const x = O.x1 - pn.inset * PT - 2;
      out += `<text transform="translate(${num(x)} ${num(O.y1 - pad)}) rotate(-90)" font-size="${pn.size}" font-family="Georgia,'Times New Roman',serif">${pn.start + p.n - 1}</text>`;
    }
    return out;
  }

  function pageInner(p, doc, measure, folioCount) {
    const text = drawText(p, doc, measure);
    const isLastPage = p.isLast;
    return `<g text-rendering="geometricPrecision" font-family="${doc.font.replace(/"/g, '&quot;')}" fill="#14100e">`
      + drawBoxes(p, doc) + text
      + (isLastPage && doc.dzog.enabled ? drawDzog(p, doc, measure) : '')
      + drawMargins(p, doc, measure, folioCount)
      + `</g>`;
  }

  function pageSvg(p, doc, measure, folioCount) {
    const { w, h } = p.boxes;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${num(w)} ${num(h)}" role="img" aria-label="Pecha page ${p.n}">${pageInner(p, doc, measure, folioCount)}</svg>`;
  }

  // ---------- sheets ----------

  // Backs run in reverse row order, because a flip along the top edge puts the bottom row behind
  // the top row. With "stack" the first sheet holds folios 1, S+1, 2S+1 so cut piles stay in order.
  function impose(doc, pages) {
    const n = doc.pecha.perSheet, mode = doc.print.sides;
    const folios = Math.ceil(pages.length / 2);
    const sheetsNeeded = Math.ceil(folios / n);
    const folioAt = (s, r) => (doc.print.stack ? r * sheetsNeeded + s : s * n + r);
    const pageOf = no => pages[no - 1] || null;
    const sheets = [];
    if (mode === 'sequence') {
      for (let i = 0; i < pages.length; i += n) sheets.push({ side: 'seq', slots: Array.from({ length: n }, (_, r) => pages[i + r] || null) });
      return sheets;
    }
    for (let s = 0; s < sheetsNeeded; s++) {
      const fronts = [], backs = [];
      for (let r = 0; r < n; r++) {
        const f = folioAt(s, r);
        fronts.push(f < folios ? pageOf(2 * f + 1) : null);
        backs.unshift(f < folios ? pageOf(2 * f + 2) : null);
      }
      if (mode !== 'backs') sheets.push({ side: 'front', slots: fronts });
      if (mode !== 'fronts') sheets.push({ side: 'back', slots: backs });
    }
    return sheets;
  }

  function sheetSvg(sheet, doc, measure, folioCount, screen) {
    const W = doc.paper.w * PT, H = doc.paper.h * PT, n = doc.pecha.perSheet;
    const strip = H / n, h = doc.pecha.height * PT, x = doc.margins.left * PT;
    let out = '';
    sheet.slots.forEach((p, r) => {
      if (!p) return;
      const y = r * strip + (strip - h) / 2;
      out += `<g transform="translate(${num(x)} ${num(y)})">${pageInner(p, doc, measure, folioCount)}</g>`;
    });
    if (doc.print.cutMarks) {
      const tick = 14;
      const line = (a, b, c, d) => `<line x1="${num(a)}" y1="${num(b)}" x2="${num(c)}" y2="${num(d)}" stroke="#000" stroke-width="0.35"/>`;
      for (let k = 1; k < n; k++) { const y = k * strip; out += line(0, y, tick, y) + line(W - tick, y, W, y); }
      const w = W - (doc.margins.left + doc.margins.right) * PT;
      for (const px of [x, x + w]) out += line(px, 0, px, tick * 0.6) + line(px, H - tick * 0.6, px, H);
    }
    const size = screen ? '' : ` width="${doc.paper.w}in" height="${doc.paper.h}in"`;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${num(W)} ${num(H)}"${size}>${out}</svg>`;
  }

  function fits(doc) {
    return doc.pecha.perSheet * doc.pecha.height <= doc.paper.h + 1e-6;
  }

  function run(doc, measure) {
    const atoms = atomize(parseStream(doc.text, doc.flow), doc, measure);
    const pages = paginate(doc, atoms, measure);
    if (pages.length) pages[pages.length - 1].isLast = true;
    const folioCount = Math.ceil(pages.length / 2);
    return { pages, folioCount };
  }

  if (def.wide || def.type === 'check') { wrap.style.gridColumn = '1 / -1'; }
  let el;
  if (def.type === 'check') {
    el = document.createElement('input'); el.type = 'checkbox'; el.id = id;
    el.checked = !!getPath(def.path);
    const span = document.createElement('span'); span.textContent = def.label;
    wrap.append(el, span);
  } else {
    const lab = document.createElement('label'); lab.htmlFor = id; lab.textContent = def.label;
    if (def.type === 'select') {
      el = document.createElement('select');
      for (const [v, t] of def.options) { const o = document.createElement('option'); o.value = v; o.textContent = t; el.append(o); }
      el.value = String(getPath(def.path));
    } else {
      el = document.createElement('input');
      el.type = def.type || 'number';
      if (def.step) el.step = def.step;
      if (def.min !== undefined) el.min = def.min;
      if (def.max !== undefined) el.max = def.max;
      const v = getPath(def.path);
      el.value = v === null ? '' : v;
      if (def.placeholder) el.placeholder = def.placeholder;
      if (def.tibetan) { el.classList.add('tib'); el.lang = 'bo'; }
    }
    el.id = id;
    wrap.append(lab, el);
  }
  el.addEventListener(def.type === 'select' || def.type === 'check' ? 'change' : 'input', () => {
    let v;
    if (def.type === 'check') v = el.checked;
    else if (def.type === 'select') v = def.number ? +el.value : el.value;
    else if (el.type === 'number') v = el.value === '' ? (def.nullable ? null : getPath(def.path)) : +el.value;
    else v = el.value;
    setPath(def.path, v);
    if (def.onChange) def.onChange(v);
    schedule();
  });
  host.append(wrap);
}

function fill(host, defs) {
  host.replaceChildren();
  defs.forEach(d => field(host, d));
}

function segment(host, options, active, onPick) {
  host.replaceChildren();
  for (const [v, t] of options) {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = t; b.setAttribute('aria-pressed', String(v === active));
    b.addEventListener('click', () => onPick(v));
    host.append(b);
  }
}

// ---------- panels ----------

function buildPanels() {
  $('text').value = doc.text;
  $('flow').checked = doc.flow;
  fill($('paperFields'), [
    { path: 'paper.name', label: 'Paper', type: 'select', options: Object.keys(PAPERS).map(k => [k, k]), onChange: v => { if (PAPERS[v]) { [doc.paper.w, doc.paper.h] = PAPERS[v]; buildPanels(); } } },
    { path: 'pecha.perSheet', label: 'Pecha per sheet', step: 1, min: 1, max: 8 },
    { path: 'fontName', label: 'Typeface', type: 'select', wide: true, options: FONTS.map(f => [f, f]), onChange: v => { doc.font = `'${v}','Noto Serif Tibetan',serif`; } },
    { path: 'paper.w', label: 'Sheet width, in', step: 0.01, min: 3, onChange: () => { doc.paper.name = 'Custom'; } },
    { path: 'paper.h', label: 'Sheet height, in', step: 0.01, min: 2, onChange: () => { doc.paper.name = 'Custom'; } },
    { path: 'pecha.height', label: 'Pecha height, in', step: 0.05, min: 0.5 },
    { path: 'margins.left', label: 'Left and right margin, in', step: 0.05, min: 0, onChange: v => { doc.margins.right = v; } },
    { path: 'pecha.dlt', label: 'Double line gap, in', step: 0.005, min: 0 },
  ]);
  fill($('orderFields'), [
    { path: 'counts.title', label: 'Title pages', step: 1, min: 0 },
    { path: 'counts.fancy', label: 'Fancy pages', step: 1, min: 0 },
  ]);
  buildTypePanel();
  fill($('yigoFields'), [
    { path: 'yigo.enabled', label: 'Add a yi-go on the front of each folio', type: 'check' },
    { path: 'yigo.text', label: 'Yi-go', type: 'select', options: [...new Set([doc.yigo.text, ...YIGOS])].map(y => [y, y]), wide: true },
    { path: 'yigo.fancyStart', label: 'Start on the first Fancy page', type: 'check' },
    { path: 'yigo.title2', label: 'Also on Title pages after the first', type: 'check' },
  ]);
  fill($('shadFields'), [
    { path: 'shad.enabled', label: 'Convert the shad after a line’s first syllable', type: 'check' },
    { path: 'shad.yang', label: 'Convert the second shad as well', type: 'check' },
    { path: 'shad.ignoreYigo', label: 'Convert on lines that start with a yi-go', type: 'check' },
    { path: 'shad.titlePages', label: 'Convert on Title pages', type: 'check' },
  ]);
  fill($('dzogFields'), [
    { path: 'dzog.enabled', label: 'Draw the dzog thik under the last lines', type: 'check' },
    { path: 'dzog.rise', label: 'Gap before it rises, in', step: 0.01, min: 0 },
  ]);
  fill($('folioFields'), [
    { path: 'folio.start', label: 'First folio (0 hides them)', step: 1, min: 0 },
    { path: 'folio.size', label: 'Size, pt', step: 1, min: 6 },
    { path: 'folio.inset', label: 'Inset from box, in', step: 0.01, min: 0 },
    { path: 'folio.onTitle', label: 'Show on Title pages', type: 'check' },
    { path: 'folio.jyon', label: 'Add བྱོན། to the last folio', type: 'check' },
    { path: 'folio.rhino', label: 'Same phrase on every folio (seru)', type: 'text', wide: true, tibetan: true },
  ]);
  fill($('pageNumFields'), [
    { path: 'pageNum.on', label: 'Show page numbers', type: 'check' },
    { path: 'pageNum.start', label: 'First page', step: 1, min: 0 },
    { path: 'pageNum.size', label: 'Size, pt', step: 1, min: 5 },
    { path: 'pageNum.onTitle', label: 'Show on Title pages', type: 'check' },
  ]);
  const ns = $('noteSide');
  ns.replaceChildren(...SIDES.map(([v, t]) => { const o = document.createElement('option'); o.value = v; o.textContent = t; return o; }));
  ns.value = noteSide;
  buildNotePanel();
  fill($('printFields'), [
    { path: 'print.sides', label: 'What to print', type: 'select', wide: true, options: [['duplex', 'Both sides, for a two-sided printer'], ['fronts', 'Fronts only (first pass)'], ['backs', 'Backs only (second pass)'], ['sequence', 'Page order, one side only']], onChange: updatePrintHelp },
    { path: 'print.cutMarks', label: 'Print cut marks', type: 'check' },
    { path: 'print.stack', label: 'Keep order when the whole stack is cut at once', type: 'check' },
  ]);
  updatePrintHelp();
}

function buildTypePanel() {
  segment($('typeSeg'), [['title', 'Title'], ['fancy', 'Fancy'], ['body', 'Body']], currentType, v => { currentType = v; buildTypePanel(); });
  const p = `types.${currentType}`;
  fill($('typeFields'), [
    { path: `${p}.lines`, label: 'Lines per page', step: 1, min: 1, max: 14 },
    { path: `${p}.fontSize`, label: 'Text size, pt', step: 1, min: 8 },
    { path: `${p}.lineHeight`, label: 'Line height, in', step: 0.01, min: 0.1 },
    { path: `${p}.top`, label: 'Box to first line, in', step: 0.01, min: 0, nullable: true, placeholder: 'centred' },
    { path: `${p}.side`, label: 'Box to text, in', step: 0.01, min: 0 },
    { path: `${p}.style`, label: 'Box lines', type: 'select', options: [['double', 'Double'], ['single', 'Single'], ['none', 'None']] },
    { path: `${p}.sideOut`, label: 'Outer side box, in', step: 0.02, min: 0 },
    { path: `${p}.sideIn`, label: 'Inner side box, in', step: 0.02, min: 0 },
    { path: `${p}.insideOn`, label: 'Use an inside box', type: 'check' },
    { path: `${p}.inside`, label: 'Inside box inset, in', step: 0.02, min: 0 },
    { path: `${p}.squeezeOn`, label: 'Squeeze the outside box', type: 'check' },
    { path: `${p}.squeeze`, label: 'Squeeze amount, in', step: 0.02, min: 0 },
    { path: `${p}.color`, label: 'Line colour', type: 'color' },
  ]);
}

function buildNotePanel() {
  const base = `notes.sets.${noteSide.replace('.', '|')}`;
  const slot = (key, label) => [
    { path: `${base}.${key}.text`, label, type: 'text', wide: true, tibetan: true, onChange: v => { getPath(`${base}.${key}`).on = !!v; } },
    { path: `${base}.${key}.size`, label: 'Size, pt', step: 1, min: 5 },
    { path: `${base}.${key}.inset`, label: 'Inset, in', step: 0.01, min: 0 },
  ];
  fill($('noteFields'), [
    ...slot('inL', 'Inside left, top'), ...slot('inB', 'Inside left, bottom'), ...slot('inR', 'Inside right'),
    ...slot('outL', 'Outside left'), ...slot('outR', 'Outside right'),
    { path: 'notes.outLeft', label: 'Space outside left, in', step: 0.02, min: 0 },
    { path: 'notes.outRight', label: 'Space outside right, in', step: 0.02, min: 0 },
  ]);
}

function updatePrintHelp() {
  const edge = doc.paper.w >= doc.paper.h ? 'long edge' : 'short edge';
  const size = `${doc.paper.w} × ${doc.paper.h} in`;
  const text = {
    duplex: `In the print dialog choose two-sided printing, flip on ${edge}, scale 100%, no margins, paper ${size}. Each folio then reads by flipping it up.`,
    fronts: `Print these first at scale 100%, then turn the stack over and turn it around so the bottom edge feeds first, and print Backs only.`,
    backs: `Load the printed fronts turned over and turned around, so the bottom edge feeds first. Rows run in reverse so each back lands behind its front.`,
    sequence: `Pages print in order on single sheets. Use this to proof the text.`,
  };
  $('printHelp').textContent = text[doc.print.sides];
}

// ---------- drawing ----------

let timer = null;
function schedule() {
  clearTimeout(timer);
  timer = setTimeout(render, 120);
}

function render() {
  const res = Engine.run(doc, measure);
  latest = res;
  const host = $('table');
  const frag = document.createDocumentFragment();
  const leaf = (tag, svg, sheet) => {
    const d = document.createElement('div');
    d.className = 'leaf' + (sheet ? ' sheet' : '');
    d.innerHTML = `<div class="tag">${tag}</div>${svg}`;
    frag.append(d);
  };
  const sheets = Engine.impose(doc, res.pages);
  if (view === 'pages') {
    for (const p of res.pages) {
      const folio = Math.ceil(p.n / 2);
      leaf(`Page ${p.n} · ${p.kind} · folio ${folio} ${p.front ? 'front' : 'back'}`, Engine.pageSvg(p, doc, measure, res.folioCount));
    }
  } else {
    sheets.forEach((s, i) => leaf(`Sheet side ${i + 1} of ${sheets.length} · ${s.side === 'seq' ? 'pages in order' : s.side}`, Engine.sheetSvg(s, doc, measure, res.folioCount, true), true));
  }
  host.replaceChildren(frag);
  const paperSheets = doc.print.sides === 'duplex' ? Math.ceil(sheets.length / 2) : sheets.length;
  $('stats').textContent = `${res.pages.length} pages · ${res.folioCount} folios · ${paperSheets} ${paperSheets === 1 ? 'sheet' : 'sheets'} of ${doc.paper.name === 'Custom' ? 'paper' : doc.paper.name}`;
  $('warn').textContent = Engine.fits(doc) ? '' : `${doc.pecha.perSheet} pecha at ${doc.pecha.height} in need ${(doc.pecha.perSheet * doc.pecha.height).toFixed(2)} in, and the sheet is ${doc.paper.h} in tall.`;
  $('pageStyle').textContent = `@page { size: ${doc.paper.w}in ${doc.paper.h}in; margin: 0; }`;
  updatePrintHelp();
  persist();
}

function buildPrint() {
  const res = latest || Engine.run(doc, measure);
  const html = Engine.impose(doc, res.pages).map(s => `<div class="sheet-print" style="width:${doc.paper.w}in;height:${doc.paper.h}in">${Engine.sheetSvg(s, doc, measure, res.folioCount, false)}</div>`).join('');
  $('printRoot').innerHTML = html;
}

// ---------- storage and files ----------

function persist() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ doc, isSample })); } catch (e) { /* private window: nothing to keep */ }
}

function restore() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    if (s && s.doc && s.doc.version === 1) return s;
  } catch (e) { /* fall through to the sample */ }
  return null;
}

function sampleDoc() {
  const d = Engine.defaultDoc();
  d.text = SAMPLE_TEXT;
  for (const k of ['fancy.front', 'body.front']) d.notes.sets[k].inL = Engine.noteSlot(SAMPLE_SHORT_TITLE, 10, 0.09);
  return d;
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { t.hidden = true; }, 4200);
}

function setDoc(d, sample) {
  doc = d; isSample = sample;
  buildPanels();
  noteSample();
  render();
}

function noteSample() {
  $('sampleNote').innerHTML = isSample
    ? 'Example text: Dorje Chang Tungma, Tibetan from <a href="https://www.lotsawahouse.org/tibetan-masters/bengar-jampal-zangpo/invoking-the-blessings" target="_blank" rel="noopener">Lotsawa House</a> (CC BY-NC). Replace it with your own text.'
    : 'Your work stays in this browser. Use Save to keep a copy.';
  $('credits').textContent = 'An independent web tool. It opens files made with PechaMaker by Frederick W. Johnson and is not affiliated with it. Typefaces: Jomolhari and Noto Serif Tibetan.';
}

async function openFile(file) {
  const buf = new Uint8Array(await file.arrayBuffer());
  const name = file.name.toLowerCase();
  try {
    if (/\.px[pct]$/.test(name)) {
      const { doc: d, unknown } = Pxp.toDoc(buf, LEGACY_TABLE, Engine.defaultDoc(), Engine);
      setDoc(d, false);
      toast(unknown ? `Opened ${file.name}. ${unknown} characters use a font this page cannot convert yet.` : `Opened ${file.name} and converted it to Unicode.`);
    } else if (/\.(pecha|json)$/.test(name)) {
      setDoc(JSON.parse(new TextDecoder().decode(buf)), false);
      toast(`Opened ${file.name}.`);
    } else {
      const d = Engine.defaultDoc();
      d.text = new TextDecoder().decode(buf);
      setDoc(d, false);
      toast(`Opened ${file.name}.`);
    }
  } catch (e) {
    toast(`Could not read ${file.name}. Use a .pxp, .pecha or .txt file.`);
  }
}

function saveFile() {
  const url = URL.createObjectURL(new Blob([JSON.stringify(doc, null, 1)], { type: 'application/json' }));
  const a = document.createElement('a');
  a.href = url; a.download = 'pecha.pecha';
  a.click();
  URL.revokeObjectURL(url);
  toast('Saved pecha.pecha to your downloads.');
}

// ---------- text helpers ----------

function insertAtCursor(s) {
  const t = $('text'), a = t.selectionStart, b = t.selectionEnd;
  t.setRangeText(s, a, b, 'end');
  t.focus();
  doc.text = t.value;
  schedule();
}

function wylieToTibetan(s) {
  try { return window.jsEWTS.fromWylie(s); } catch (e) { return ''; }
}

function init() {
  const codes = [['Centre', '{c}'], ['Justify', '{j}'], ['Left', '{l}'], ['Larger', '{30}'], ['Normal size', '{size}'], ['Red', '{#b03020}'], ['Black', '{color}'], ['New page', '{page}'], ['Fixed shad', '{hs}']];
  for (const [label, code] of codes) {
    const b = document.createElement('button');
    b.className = 'chip'; b.type = 'button'; b.textContent = label; b.title = `Inserts ${code}`;
    b.addEventListener('click', () => insertAtCursor(code));
    $('codes').append(b);
  }
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-selected', String(x === b)));
    document.querySelectorAll('.pane').forEach(p => { p.hidden = p.dataset.pane !== b.dataset.tab; });
    if (b.dataset.tab === 'print') setView('sheets');
  }));
  $('text').addEventListener('input', e => { doc.text = e.target.value; isSample = false; noteSample(); schedule(); });
  $('flow').addEventListener('change', e => { doc.flow = e.target.checked; schedule(); });
  $('noteSide').addEventListener('change', e => { noteSide = e.target.value; buildNotePanel(); });
  $('wylie').addEventListener('input', e => { $('wyliePreview').textContent = wylieToTibetan(e.target.value); });
  $('wylieInsert').addEventListener('click', () => {
    const s = wylieToTibetan($('wylie').value);
    if (s) insertAtCursor(s);
    $('wylie').value = ''; $('wyliePreview').textContent = '';
  });
  $('newDoc').addEventListener('click', () => { const d = Engine.defaultDoc(); setDoc(d, false); $('text').focus(); });
  $('openFile').addEventListener('change', e => { if (e.target.files[0]) openFile(e.target.files[0]); e.target.value = ''; });
  $('saveDoc').addEventListener('click', saveFile);
  $('printBtn').addEventListener('click', () => {
    buildPrint();
    if (!Engine.fits(doc)) toast('The pecha do not fit on this sheet. Reduce the height or the number per sheet.');
    window.print();
  });
  window.addEventListener('beforeprint', buildPrint);
  const saved = new URLSearchParams(location.search).has('sample') ? null : restore();
  setView('pages', true);
  if (saved) setDoc(saved.doc, saved.isSample); else setDoc(sampleDoc(), true);
  if (new URLSearchParams(location.search).has('sheets')) setView('sheets');
  if (new URLSearchParams(location.search).has('print')) buildPrint();
}

function setView(v, quiet) {
  view = v;
  segment($('viewSeg'), [['pages', 'Pages'], ['sheets', 'Print sheets']], view, x => setView(x));
  if (!quiet) render();
}

Promise.all(['Jomolhari', 'Noto Serif Tibetan'].map(f => document.fonts.load(`20px "${f}"`, 'ཀ'))).catch(() => {}).then(init);
</script>
